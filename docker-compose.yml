version: '3.8'
services:
  app:
    build: .
    image: sgiva_app:latest
    container_name: sgiva_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - sgiva-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sgiva_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sgiva
      MYSQL_USER: sgiva
      MYSQL_PASSWORD: secret
    ports:
      - 3306:3306
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sgiva-network

  nginx:
    image: nginx:stable-alpine
    container_name: sgiva_nginx
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sgiva-network

volumes:
  db_data:

networks:
  sgiva-network:
    driver: bridge
